plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = '1.24.0'
group = 'dev.companions'
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
jar { from('LICENSE') }

tasks.register('sourceZip', Zip) {
    dependsOn build
    archiveFileName = "deterministic-companions-${project.version}-project.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'docs/**', 'gradlew', 'gradlew.bat'
        include 'build.gradle', 'settings.gradle', 'gradle.properties', '.gitignore'
        include 'README.md', 'COMMANDS.md', 'TESTING.md', 'SOURCE_TREE.txt', 'LICENSE'
    }
    from(tasks.jar) { into 'artifacts' }
    from(tasks.sourcesJar) { into 'artifacts' }
}

